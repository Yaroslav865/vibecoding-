    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #e6edf3;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #30363d;
        }

        h1 span {
            color: #58a6ff;
        }

        .file-list {
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            color: #c9d1d9;
            transition: background-color 0.15s ease;
            border-bottom: 1px solid #21262d;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: #161b22;
        }

        .file-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .file-name {
            font-size: 15px;
            color: #58a6ff;
            flex-grow: 1;
        }

        .file-item:hover .file-name {
            text-decoration: underline;
        }

        .file-desc {
            font-size: 13px;
            color: #8b949e;
            margin-left: auto;
            padding-left: 16px;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #484f58;
        }
    </style>
</head>
