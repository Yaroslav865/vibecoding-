<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCodeCamp — Полный курс Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-dark: #0a0a23;
  --bg-darker: #05051a;
  --bg-panel: #1b1b32;
  --bg-lighter: #2a2a4a;
  --text: #dfdfe2;
  --text-dim: #a0a0b8;
  --accent: #f1be32;
  --accent-hover: #ffdf5d;
  --green: #acd157;
  --red: #ff6b6b;
  --blue: #4d8cf5;
  --border: #3b3b5a;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
header {
  background: var(--bg-darker);
  border-bottom: 2px solid var(--accent);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}
.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--bg-dark);
  font-weight: 900;
  font-size: 20px;
}
.header-actions { display: flex; gap: 12px; align-items: center; }
.progress-info {
  font-size: 13px;
  color: var(--text-dim);
}
.progress-info strong { color: var(--accent); }
.btn {
  background: var(--accent);
  color: var(--bg-dark);
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.btn:hover { background: var(--accent-hover); }
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-lighter); }
.btn-success { background: var(--green); }
.btn-success:hover { background: #c0e060; }

main {
  display: grid;
  grid-template-columns: 280px 1fr 1fr;
  height: calc(100vh - 60px);
}
.sidebar {
  background: var(--bg-darker);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.module-title {
  padding: 10px 20px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  font-weight: 700;
  margin-top: 12px;
}
.module-title:first-child { margin-top: 0; }
.lesson-item {
  padding: 10px 20px;
  font-size: 14px;
  cursor: pointer;
  border-left: 3px solid transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s;
  color: var(--text-dim);
}
.lesson-item:hover { background: var(--bg-panel); color: var(--text); }
.lesson-item.active {
  background: var(--bg-panel);
  border-left-color: var(--accent);
  color: var(--text);
}
.lesson-item.completed .lesson-check {
  color: var(--green);
}
.lesson-check {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}
.lesson-item.completed .lesson-check {
  border-color: var(--green);
  background: var(--green);
  color: var(--bg-dark);
}
.lesson-item.completed .lesson-check::after { content: "✓"; }
.lesson-title-text { flex: 1; }

.content-panel {
  overflow-y: auto;
  padding: 32px 40px;
  background: var(--bg-dark);
}
.content-panel::-webkit-scrollbar { width: 8px; }
.content-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.lesson-header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
  margin-bottom: 24px;
}
.lesson-breadcrumb {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.lesson-main-title {
  font-size: 28px;
  color: var(--accent);
  margin-bottom: 8px;
}
.lesson-meta {
  font-size: 13px;
  color: var(--text-dim);
}
.lesson-body {
  line-height: 1.7;
  font-size: 16px;
}
.lesson-body h2 {
  color: var(--accent);
  margin: 28px 0 14px;
  font-size: 22px;
}
.lesson-body h3 {
  color: var(--blue);
  margin: 22px 0 10px;
  font-size: 18px;
}
.lesson-body p { margin-bottom: 14px; }
.lesson-body ul, .lesson-body ol { margin: 12px 0 14px 24px; }
.lesson-body li { margin-bottom: 6px; }
.lesson-body code {
  background: var(--bg-panel);
  padding: 2px 7px;
  border-radius: 3px;
  font-family: 'Fira Code', Consolas, monospace;
  font-size: 0.9em;
  color: var(--accent);
}
.lesson-body pre {
  background: var(--bg-darker);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  border-radius: 4px;
  margin: 14px 0;
  overflow-x: auto;
  font-family: 'Fira Code', Consolas, monospace;
  font-size: 14px;
  line-height: 1.5;
}
.lesson-body pre code {
  background: transparent;
  padding: 0;
  color: var(--text);
}
.lesson-body .note {
  background: rgba(77, 140, 245, 0.1);
  border-left: 3px solid var(--blue);
  padding: 12px 16px;
  margin: 16px 0;
  border-radius: 4px;
}
.lesson-body .note strong { color: var(--blue); }
.task-box {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 22px;
  margin: 20px 0;
}
.task-box h4 {
  color: var(--accent);
  margin-bottom: 10px;
  font-size: 16px;
}
.task-box ol { margin-left: 20px; }

.editor-panel {
  background: var(--bg-darker);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
}
.editor-toolbar {
  padding: 10px 16px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.editor-toolbar-title {
  font-size: 13px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.editor-toolbar-actions { display: flex; gap: 8px; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.editor-wrapper {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.CodeMirror {
  height: 100% !important;
  font-family: 'Fira Code', Consolas, monospace !important;
  font-size: 14px !important;
  background: var(--bg-darker) !important;
}
.output-panel {
  background: var(--bg-darker);
  border-top: 2px solid var(--accent);
  padding: 12px 16px;
  max-height: 200px;
  overflow-y: auto;
  font-family: 'Fira Code', Consolas, monospace;
  font-size: 13px;
}
.output-header {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}
.output-content {
  white-space: pre-wrap;
  color: var(--text);
  line-height: 1.5;
}
.output-content.error { color: var(--red); }
.output-content.success { color: var(--green); }
.test-result {
  padding: 6px 10px;
  margin: 4px 0;
  border-radius: 3px;
  font-size: 13px;
}
.test-result.pass { background: rgba(172, 209, 87, 0.15); color: var(--green); }
.test-result.fail { background: rgba(255, 107, 107, 0.15); color: var(--red); }

.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  gap: 20px;
}
.loading-spinner {
  width: 60px; height: 60px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: var(--text);
  font-size: 16px;
}
.loading-sub {
  color: var(--text-dim);
  font-size: 13px;
}

.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: var(--green);
  color: var(--bg-dark);
  padding: 14px 22px;
  border-radius: 6px;
  font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: var(--red); color: white; }

@media (max-width: 1024px) {
  main { grid-template-columns: 240px 1fr; }
  .editor-panel { display: none; }
}
@media (max-width: 768px) {
  main { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  header { padding: 10px 16px; }
  .content-panel { padding: 20px; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="logo-icon" style="width:80px;height:80px;font-size:40px;">Py</div>
  <div class="loading-text">Загрузка PyCodeCamp...</div>
  <div class="loading-sub">Инициализация интерпретатора Python в браузере</div>
  <div class="loading-spinner"></div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">Py</div>
    <span>PyCodeCamp</span>
  </div>
  <div class="header-actions">
    <div class="progress-info">
      Прогресс: <strong id="progressText">0 / 0</strong>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="resetProgress()">Сброс</button>
  </div>
</header>

<main>
  <aside class="sidebar" id="sidebar"></aside>
  <section class="content-panel" id="content"></section>
  <section class="editor-panel">
    <div class="editor-toolbar">
      <div class="editor-toolbar-title">Редактор Python</div>
      <div class="editor-toolbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="resetCode()">↺ Сброс</button>
        <button class="btn btn-sm" onclick="runCode()">▶ Запустить</button>
        <button class="btn btn-success btn-sm" onclick="checkSolution()">✓ Проверить</button>
      </div>
    </div>
    <div class="editor-wrapper">
      <textarea id="codeEditor"></textarea>
    </div>
    <div class="output-panel">
      <div class="output-header">
        <span>Вывод / Результат</span>
        <span id="outputStatus"></span>
      </div>
      <div class="output-content" id="output"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
// ============ COURSE DATA ============
const course = [
  {
    module: "Модуль 1: Введение в Python",
    lessons: [
      {
        title: "Привет, Python!",
        body: `
          <h2>Добро пожаловать в мир Python!</h2>
          <p>Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
          <p>Python славится своим простым и читаемым синтаксисом, что делает его идеальным языком для начинающих.</p>
          <h3>Ваша первая программа</h3>
          <p>Традиционно изучение любого языка начинается с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
          <pre><code>print("Hello, World!")</code></pre>
          <p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — это называется <strong>строкой</strong> (string).</p>
          <div class="note"><strong>💡 Совет:</strong> В Python можно использовать как двойные <code>"</code>, так и одинарные <code>'</code> кавычки.</div>
        `,
        initialCode: `# Выведите на экран: Hello, World!\n\n`,
        tests: [
          { desc: "Программа должна вывести 'Hello, World!'", check: (out) => out.trim() === "Hello, World!" }
        ]
      },
      {
        title: "Комментарии в коде",
        body: `
          <h2>Комментарии</h2>
          <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают вам и другим программистам понимать код.</p>
          <h3>Однострочные комментарии</h3>
          <p>Начинаются с символа <code>#</code>:</p>
          <pre><code># Это комментарий
print("Привет")  # Это тоже комментарий</code></pre>
          <h3>Многострочные комментарии</h3>
          <p>Используйте тройные кавычки:</p>
          <pre><code>"""
Это многострочный
комментарий
"""
print("Код работает")</code></pre>
          <div class="note"><strong>💡 Важно:</strong> Пишите комментарии, чтобы объяснить <em>почему</em> код делает что-то, а не <em>что</em> он делает.</div>
        `,
        initialCode: `# Напишите комментарий о том, что это ваша первая программа\n# Затем выведите: Я учу Python\n\n`,
        tests: [
          { desc: "Программа должна вывести 'Я учу Python'", check: (out) => out.includes("Я учу Python") },
          { desc: "В коде должен быть комментарий", check: (src) => src.includes("#") }
        ]
      },
      {
        title: "Арифметические операции",
        body: `
          <h2>Математика в Python</h2>
          <p>Python — отличный калькулятор! Вот основные арифметические операторы:</p>
          <ul>
            <li><code>+</code> — сложение</li>
            <li><code>-</code> — вычитание</li>
            <li><code>*</code> — умножение</li>
            <li><code>/</code> — деление (возвращает float)</li>
            <li><code>//</code> — целочисленное деление</li>
            <li><code>%</code> — остаток от деления</li>
            <li><code>**</code> — возведение в степень</li>
          </ul>
          <pre><code>print(10 + 5)   # 15
print(10 - 3)   # 7
print(4 * 5)    # 20
print(10 / 3)   # 3.333...
print(10 // 3)  # 3
print(10 % 3)   # 1
print(2 ** 10)  # 1024</code></pre>
          <div class="note"><strong>💡 Запомните:</strong> При делении <code>/</code> результат всегда float, даже если числа делятся без остатка.</div>
        `,
        initialCode: `# Вычислите и выведите:\n# 1. Сумму 123 и 456\n# 2. Результат 2 в степени 8\n# 3. Остаток от деления 17 на 5\n\n`,
        tests: [
          { desc: "Должно быть выведено 579 (123+456)", check: (out) => out.includes("579") },
          { desc: "Должно быть выведено 256 (2^8)", check: (out) => out.includes("256") },
          { desc: "Должно быть выведено 2 (17%5)", check: (out) => out.includes("2") }
        ]
      }
    ]
  },
  {
    module: "Модуль 2: Переменные и типы данных",
    lessons: [
      {
        title: "Создание переменных",
        body: `
          <h2>Переменные</h2>
          <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
          <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)      # Алиса
print(age)       # 25</code></pre>
          <h3>Правила именования</h3>
          <ul>
            <li>Могут содержать буквы, цифры и символ <code>_</code></li>
            <li>Не могут начинаться с цифры</li>
            <li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
            <li>Используйте <code>snake_case</code> для имён: <code>my_variable</code></li>
          </ul>
          <div class="note"><strong>💡 Совет:</strong> Давайте переменным понятные имена. <code>user_age</code> лучше, чем <code>x</code>.</div>
        `,
        initialCode: `# Создайте переменные:\n# name со значением "Python"\n# version со значением 3\n# is_fun со значением True\n# Затем выведите их все\n\n`,
        tests: [
          { desc: "Должно быть выведено 'Python'", check: (out) => out.includes("Python") },
          { desc: "Должно быть выведено 3", check: (out) => out.includes("3") },
          { desc: "Должно быть выведено True", check: (out) => out.includes("True") }
        ]
      },
      {
        title: "Числовые типы",
        body: `
          <h2>Числа: int и float</h2>
          <p>В Python два основных числовых типа:</p>
          <ul>
            <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
            <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
          </ul>
          <pre><code>x = 10        # int
y = 3.14      # float

print(type(x))  # &lt;class 'int'&gt;
print(type(y))  # &lt;class 'float'&gt;</code></pre>
          <h3>Преобразование типов</h3>
          <pre><code># Из строки в число
num = int("42")      # 42
pi = float("3.14")   # 3.14

# Из числа в строку
text = str(100)      # "100"

# float в int (отбрасывает дробную часть)
whole = int(3.99)    # 3</code></pre>
        `,
        initialCode: `# Создайте переменную radius = 5\n# Вычислите площадь круга (π * r²), используя π = 3.14159\n# Выведите результат\n\n`,
        tests: [
          { desc: "Должно быть выведено значение около 78.5", check: (out) => {
            const m = out.match(/[\\d.]+/);
            return m && Math.abs(parseFloat(m[0]) - 78.53975) < 0.1;
          }}
        ]
      },
      {
        title: "Строки (str)",
        body: `
          <h2>Строки</h2>
          <p>Строка — это последовательность символов. Создаётся с помощью кавычек:</p>
          <pre><code>s1 = "Привет"
s2 = 'Мир'
s3 = """Многострочная
строка"""</code></pre>
          <h3>Операции со строками</h3>
          <pre><code># Конкатенация (сложение)
full = "Привет" + " " + "Мир"  # "Привет Мир"

# Повторение
line = "-" * 10  # "----------"

# Длина строки
length = len("Python")  # 6

# Доступ по индексу
first = "Python"[0]  # "P"
last = "Python"[-1]  # "n"</code></pre>
          <h3>f-строки (форматирование)</h3>
          <pre><code>name = "Алиса"
age = 25
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
        `,
        initialCode: `# Создайте переменные first_name и last_name\n# Выведите с помощью f-строки: "Меня зовут [Имя] [Фамилия]"\n# Также выведите количество символов в полном имени (с пробелом)\n\n`,
        tests: [
          { desc: "Должна быть f-строка с именем и фамилией", check: (out) => /Меня зовут \\w+ \\w+/.test(out) },
          { desc: "Должно быть выведено число (длина имени)", check: (out) => /\\d+/.test(out) }
        ]
      },
      {
        title: "Логический тип (bool)",
        body: `
          <h2>Булев тип</h2>
          <p>Тип <code>bool</code> имеет только два значения: <code>True</code> (истина) и <code>False</code> (ложь).</p>
          <pre><code>is_active = True
is_deleted = False

print(type(is_active))  # &lt;class 'bool'&gt;</code></pre>
          <h3>Операторы сравнения</h3>
          <pre><code>print(5 == 5)   # True (равно)
print(5 != 3)   # True (не равно)

// ============ STATE ============
let pyodide = null;
let editor = null;
let currentModule = 0;
let currentLesson = 0;
let completedLessons = JSON.parse(localStorage.getItem('pycodecamp_progress') || '{}');

// ============ INIT ============
async function init() {
  try {
    pyodide = await loadPyodide();
    await pyodide.loadPackage("micropip");
  } catch (e) {
    console.error("Pyodide load error:", e);
  }
  
  editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
    mode: 'python',
    theme: 'dracula',
    lineNumbers: true,
    tabSize: 4,
    indentWithTabs: false,
    indentUnit: 4,
    lineWrapping: true,
    matchBrackets: true,
    autoCloseBrackets: true
  });
  
  renderSidebar();
  loadLesson(0, 0);
  updateProgress();
  
  document.getElementById('loading').style.display = 'none';
}

// ============ SIDEBAR ============
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  let lessonIdx = 0;
  
  course.forEach((module, mi) => {
    html += `<div class="module-title">${module.module}</div>`;
    module.lessons.forEach((lesson, li) => {
      const key = `${mi}-${li}`;
      const completed = completedLessons[key] ? 'completed' : '';
      const active = (mi === currentModule && li === currentLesson) ? 'active' : '';
      html += `<div class="lesson-item ${completed} ${active}" onclick="loadLesson(${mi}, ${li})" data-idx="${mi}-${li}">
        <div class="lesson-check"></div>
        <div class="lesson-title-text">${lesson.title}</div>
      </div>`;
      lessonIdx++;
    });
  });
  
  sidebar.innerHTML = html;
}

// ============ LESSON ============
function loadLesson(mi, li) {
  currentModule = mi;
  currentLesson = li;
  const lesson = course[mi].lessons[li];
  
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-breadcrumb">${course[mi].module} • Урок ${li + 1} из ${course[mi].lessons.length}</div>
      <h1 class="lesson-main-title">${lesson.title}</h1>
      <div class="lesson-meta">
        ${lesson.tests.length} ${lesson.tests.length === 1 ? 'задание' : 'заданий'} • ${estimateTime(lesson.body)} мин чтения
      </div>
    </div>
    <div class="lesson-body">
      ${lesson.body}
      <div class="task-box">
        <h4>🎯 Задание</h4>
        <p>Напишите код в редакторе справа и нажмите "Проверить", чтобы пройти урок.</p>
      </div>
    </div>
  `;
  content.scrollTop = 0;
  
  editor.setValue(lesson.initialCode);
  document.getElementById('output').textContent = '';
  document.getElementById('output').className = 'output-content';
  document.getElementById('outputStatus').textContent = '';
  
  renderSidebar();
}

function estimateTime(html) {
  const text = html.replace(/<[^>]+>/g, '');
  const words = text.split(/\s+/).length;
  return Math.max(1, Math.round(words / 200));
}

// ============ CODE EXECUTION ============
async function runCode() {
  const code = editor.getValue();
  const outputEl = document.getElementById('output');
  const statusEl = document.getElementById('outputStatus');
  
  outputEl.textContent = 'Выполнение...';
  outputEl.className = 'output-content';
  statusEl.textContent = '';
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
    pyodide.runPython(code);
    const output = pyodide.runPython('sys.stdout.getvalue()');
    outputEl.textContent = output || '(нет вывода)';
    outputEl.className = 'output-content success';
    statusEl.textContent = '✓ OK';
    statusEl.style.color = 'var(--green)';
  } catch (err) {
    outputEl.textContent = err.message;
    outputEl.className = 'output-content error';
    statusEl.textContent = '✗ Ошибка';
    statusEl.style.color = 'var(--red)';
  } finally {
    try {
      pyodide.runPython('sys.stdout = sys.__stdout__');
    } catch(e) {}
  }
}

async function checkSolution() {
  const code = editor.getValue();
  const lesson = course[currentModule].lessons[currentLesson];
  const outputEl = document.getElementById('output');
  const statusEl = document.getElementById('outputStatus');
  
  outputEl.textContent = 'Проверка...';
  outputEl.className = 'output-content';
  statusEl.textContent = '';
  
  let stdout = '';
  let error = null;
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
    pyodide.runPython(code);
    stdout = pyodide.runPython('sys.stdout.getvalue()');
  } catch (err) {
    error = err.message;
  } finally {
    try {
      pyodide.runPython('sys.stdout = sys.__stdout__');
    } catch(e) {}
  }
  
  let html = '';
  let allPassed = true;
  
  lesson.tests.forEach((test, i) => {
    let passed = false;
    let message = '';
    
    if (error) {
      passed = false;
      message = `Ошибка: ${error}`;
    } else {
      try {
        passed = test.check(stdout, code);
        message = passed ? 'Пройдено' : 'Не пройдено';
      } catch (e) {
        passed = false;
        message = `Ошибка проверки: ${e.message}`;
      }
    }
    
    if (!passed) allPassed = false;
    html += `<div class="test-result ${passed ? 'pass' : 'fail'}">
      ${passed ? '✓' : '✗'} ${test.desc} — ${message}
    </div>`;
  });
  
  if (error) {
    html += `<div style="margin-top:10px;color:var(--red);font-size:12px;">Ошибка выполнения: ${error}</div>`;
  } else if (stdout) {
    html += `<div style="margin-top:10px;padding:8px;background:var(--bg-panel);border-radius:3px;font-size:12px;"><strong>Вывод:</strong><br>${escapeHtml(stdout)}</div>`;
  }
  
  outputEl.innerHTML = html;
  outputEl.className = 'output-content';
  
  if (allPassed) {
    statusEl.textContent = '✓ Урок пройден!';
    statusEl.style.color = 'var(--green)';
    const key = `${currentModule}-${currentLesson}`;
    if (!completedLessons[key]) {
      completedLessons[key] = true;
      localStorage.setItem('pycodecamp_progress', JSON.stringify(completedLessons));
      updateProgress();
      renderSidebar();
      showToast('🎉 Отлично! Урок пройден!');
      
      // Auto-advance
      setTimeout(() => {
        const nextLesson = findNextLesson(currentModule, currentLesson);
        if (nextLesson) {
          if (confirm('Урок пройден! Перейти к следующему уроку?')) {
            loadLesson(nextLesson[0], nextLesson[1]);
          }
        } else {
          showToast('🏆 Поздравляем! Вы прошли весь курс!', 4000);
        }
      }, 1500);
    }
  } else {
    statusEl.textContent = '✗ Есть ошибки';
    statusEl.style.color = 'var(--red)';
  }
}

function findNextLesson(mi, li) {
  if (li + 1 < course[mi].lessons.length) {
    return [mi, li + 1];
  }
  if (mi + 1 < course.length) {
    return [mi + 1, 0];
  }
  return null;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============ UTILS ============
function resetCode() {
  const lesson = course[currentModule].lessons[currentLesson];
  editor.setValue(lesson.initialCode);
  document.getElementById('output').textContent = '';
  document.getElementById('output').className = 'output-content';
  document.getElementById('outputStatus').textContent = '';
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс? Это действие нельзя отменить.')) {
    completedLessons = {};
    localStorage.removeItem('pycodecamp_progress');
    updateProgress();
    renderSidebar();
    showToast('Прогресс сброшен');
  }
}

function updateProgress() {
  let total = 0;
  course.forEach(m => total += m.lessons.length);
  const done = Object.keys(completedLessons).length;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
}

function showToast(message, duration = 2500) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

// Start
window.addEventListener('load', init);
</script>
